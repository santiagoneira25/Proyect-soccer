const FD=1/120,MAG=.008;
/* fricción tangencial en el punto de contacto: convierte deslizamiento en giro (balón sólido) */
function fric(B,nx,ny,pvx,pvy,mu){const tx=-ny,ty=nx,st=(B.vx-pvx+B.w*BR*ny)*tx+(B.vy-pvy-B.w*BR*nx)*ty,J=st*mu/3.5;B.vx-=J*tx;B.vy-=J*ty;B.w+=2.5*J/BR}
function pp(x,y,vx,vy,l,c,r,g,k){M.pt.push({x,y,vx,vy,l,L:l,c,r,g,k})}
function dust(x,y,n,v){for(let i=0;i<n;i++)pp(x+(rnd()-.5)*10,y,(rnd()-.5)*Math.min(200,v*.3),-20-rnd()*50,.5+rnd()*.3,'#d9cdb0',3+rnd()*3,-40,0)}
function conf(i){const t=M.p[i].t,cl=[t[1],t[2],'#ffd23f','#ffffff'];for(let k=0;k<110;k++)pp(rnd()*W,-10-rnd()*80,(rnd()-.5)*90,30+rnd()*80,2.6+rnd(),cl[k%4],2.2+rnd()*1.6,60,1)}
